<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Memory Game</h1>
                <p >Choose the pictures you want to play with!</p>

                <div id="category-buttons">
                    <button class="btn btn-secondary" id="harry-potter">Harry Potter</button>
                    <button class="btn btn-secondary" id="dogs">Dogs</button>
                    <button class="btn btn-secondary" id="superheroes">Superheroes</button>
                    <button class="btn btn-secondary" id="random">Random</button>
                </div>

                <p id="game-message">Choose a category to start!</p>

                <div id="game-board"></div>
            </div>
        </div>
    </div>
</body>

</html>
